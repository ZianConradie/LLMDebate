[project]
name = "argument-chatterbox-runtime"
version = "0.1.0"
description = "Isolated CPU runtime for Chatterbox-Nano speech generation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@ab55923c27757c90cfcc407baa57dc25a7d25217",
    "soundfile>=0.12.1",
    "torch==2.6.0",
    "torchaudio==2.6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
