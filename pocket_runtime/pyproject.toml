[project]
name = "argument-pocket-tts-runtime"
version = "0.1.0"
description = "Isolated CPU runtime for Pocket TTS speech generation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pocket-tts>=1.0",
    "soundfile>=0.12.1",
    "torch>=2.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
